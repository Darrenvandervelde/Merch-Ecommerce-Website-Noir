; NOIR store settings
; Edit values here for local / demo configuration.
; Sensitive secrets should still live in environment variables only.

[app]
name = NOIR
tagline = Premium Streetwear + 3D Lab
currency = USD
locale = en-US
free_shipping_threshold = 100
shipping_flat_rate = 8
tax_rate = 0.08

[store]
support_email = support@noir.example
returns_days = 30
estimated_delivery_days_min = 3
estimated_delivery_days_max = 7

[features]
sticky_add_to_cart = true
recently_viewed = true
compare = true
waitlist = true
dark_mode = false

[api]
; Prefer VITE_API_URL in .env for real deployments
base_url =

[3d_lab]
enabled = true
label = 3D Lab
made_to_order_lead_days = 5

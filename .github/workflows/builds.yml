name: Node.js CI

on: 
  push: 
    branches:
      - main

  pull_request: 
    branches:
      - main

jobs: 
  build: 

    runs-on: windows-latest
    
    steps: 
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with: 
          node-version: '20.x'
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Use npm install so CI still works if package-lock is briefly out of sync.
      # Prefer npm ci once the lockfile is committed and verified in sync.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build
        env:
          VITE_APP_NAME: NOIR

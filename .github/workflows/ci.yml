name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # package-lock.json is currently out of sync with package.json
      # (missing three, express, bcryptjs, etc.). Use npm install until
      # the lockfile is regenerated and committed, then switch back to npm ci.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build
        env:
          VITE_APP_NAME: NOIR
